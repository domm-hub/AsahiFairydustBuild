name: Build Fairydust Kernel (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            bc \
            clang \
            llvm \
            libclang-dev \
            pkg-config \
            git

      - name: Install Rust toolchain (stable) and components
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rust-src, llvm-tools-preview
          override: true

      - name: Add Rust target (if cross-compiling)
        run: |
          rustup target add aarch64-unknown-linux-gnu || true

      - name: Install updated bindgen-cli
        run: |
          cargo install bindgen-cli --version 0.71.1
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run kernel build script
        run: |
          chmod +x ./run_build.sh
          ./run_build.sh

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fairydust-kernel-arm64
          path: dist/
