name: Build Fairydust Kernel (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            dwarves \
            device-tree-compiler \
            python3 \
            perl \
            rsync \
            cpio \
            kmod \
            xz-utils \
            zstd \
            lz4 \
            ccache \
            clang \
            llvm \
            libclang-dev \
            pkg-config \
            git

      - name: Install lld and binutils (linker tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y lld binutils
          ld.lld --version

      - name: Check available system resources
        run: |
          echo "=== System Resources ==="
          echo "Disk space:"
          df -h /
          echo ""
          echo "Available RAM:"
          free -h
        id: resources_check

      - name: Ensure sufficient disk space and remove non-essential preinstalled packages if under threshold
        run: |
          set -eux
          MIN_GB=28
          echo "Checking available disk space on /"
          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Available: ${FREE_GB} GB"
          if [ "${FREE_GB}" -lt "${MIN_GB}" ]; then
            echo "Free space (${FREE_GB}GB) is below ${MIN_GB}GB — cleaning caches and removing non-essential files."
            sudo apt-get clean || true
            sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb || true
            sudo rm -rf /usr/share/doc/* /usr/share/man/* /usr/share/locale/* /usr/share/info/* || true
            if command -v snap >/dev/null 2>&1; then
              echo "Removing snap and related data"
              sudo snap remove --purge --all || true
              sudo apt-get remove --purge -y snapd || true
              sudo rm -rf /var/lib/snapd /snap || true
            fi
            sudo apt-get autoremove -y || true
            FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
            echo "Available after cleanup: ${FREE_GB} GB"
            if [ "${FREE_GB}" -lt "${MIN_GB}" ]; then
              echo "Warning: still under ${MIN_GB}GB after cleanup (available=${FREE_GB}GB)."
              echo "need_swap=true" >> $GITHUB_ENV
            else
              echo "Sufficient disk space after cleanup: ${FREE_GB}GB"
              echo "need_swap=false" >> $GITHUB_ENV
            fi
          else
            echo "Sufficient disk space available: ${FREE_GB}GB"
            echo "need_swap=false" >> $GITHUB_ENV
          fi
        id: disk_check

      - name: Check available RAM
        run: |
          echo "Checking available RAM..."
          RAM_TOTAL=$(free -h | grep Mem | awk '{print $2}' | sed 's/Gi//' | sed 's/G//')
          RAM_AVAILABLE=$(free -h | grep Mem | awk '{print $7}' | sed 's/Gi//' | sed 's/G//')
          echo "Total RAM: ${RAM_TOTAL}GB"
          echo "Available RAM: ${RAM_AVAILABLE}GB"
          if (( $(echo "$RAM_AVAILABLE >= 16" | bc -l) )); then
            echo "Sufficient RAM available (${RAM_AVAILABLE}GB >= 16GB) - swap not needed"
            echo "need_swap=false" >> $GITHUB_ENV
          else
            echo "RAM available (${RAM_AVAILABLE}GB) < 16GB - swap will be created"
            echo "need_swap=true" >> $GITHUB_ENV
          fi
        id: ram_check

      - name: Prepare swap (cleanup if exists)
        run: |
          echo "Checking for existing swap..."
          if swapon --show | grep -q /swapfile; then
            echo "Existing swap found at /swapfile, disabling..."
            sudo swapoff /swapfile || true
          fi
          sudo rm -f /swapfile || true
          echo "Swap prepared"

      - name: Create swap (only if needed)
        if: env.need_swap == 'true'
        run: |
          echo "Creating swap file..."
          SWAP_SIZE_MB=8192
          sudo dd if=/dev/zero of=/swapfile bs=1M count=${SWAP_SIZE_MB} status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show || true

      - name: Install Rust toolchain (stable) and components
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rust-src, llvm-tools-preview
          override: true

      - name: Configure Rust environment
        run: |
          echo "RUSTUP_TOOLCHAIN=stable" >> $GITHUB_ENV
          SYSROOT=$(rustc --print sysroot)
          echo "RUST_LIB_SRC=${SYSROOT}/lib/rustlib/src/rust/library" >> $GITHUB_ENV
          rustup component add rust-src || true
          rustc --version
          rustup show

      - name: Install updated bindgen-cli
        run: |
          cargo install bindgen-cli --version 0.71.1
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run kernel build script
        run: |
          chmod +x ./run_build.sh
          ./run_build.sh

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fairydust-kernel-arm64
          path: dist/

      - name: Disable and remove swap
        if: always()
        run: |
          echo "Cleaning up swap..."
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile || true
          echo "Swap removed"
