name: Build Fairydust Kernel (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            bc \
            clang \
            llvm \
            libclang-dev \
            pkg-config \
            git

      - name: Install lld and binutils (linker tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y lld binutils || true
          ld.lld --version || true

      - name: Create swap (8GB) to avoid OOM during link
        run: |
          # create an 8GB swapfile, fallocate may not be present on some images
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap created:"; sudo swapon --show || true

      - name: Install Rust toolchain (stable) and components
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rust-src, llvm-tools-preview
          override: true

      - name: Configure Rust environment
        run: |
          # Ensure the env is visible to subsequent steps
          echo "RUSTUP_TOOLCHAIN=stable" >> $GITHUB_ENV
          SYSROOT=$(rustc --print sysroot)
          echo "RUST_LIB_SRC=${SYSROOT}/lib/rustlib/src/rust/library" >> $GITHUB_ENV
          # Ensure rust-src component is present (idempotent)
          rustup component add rust-src || true
          # Diagnostic info
          rustc --version
          rustup show

      - name: Add Rust target (if cross-compiling)
        run: |
          rustup target add aarch64-unknown-linux-gnu || true

      - name: Install updated bindgen-cli
        run: |
          cargo install bindgen-cli --version 0.71.1
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run kernel build script
        run: |
          chmod +x ./run_build.sh
          ./run_build.sh

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fairydust-kernel-arm64
          path: dist/

      - name: Disable and remove swap
        if: always()
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile || true
          echo "Swap removed"
