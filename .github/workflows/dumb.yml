name: Remote Download, Compress, and Tunnel

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL of the file to download'
        required: true
        default: 'https://tobhe.de'

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # 4 vCPUs, 16 GB RAM (ARM64)
    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Download the large image fast
      run: |
        sudo apt-get update && sudo apt-get install -y aria2
        echo "Downloading image using aria2c..."
        aria2c -x 16 -s 16 -o asahi-ubuntu.img "${{ inputs.file_url }}"

    - name: Compress Absolute Maximum (7z LZMA2 Ultra)
      run: |
        echo "Compressing using 4 ARM cores..."
        7z a -t7z -m0=lzma2 -mx=9 -md=512m -mfb=273 -ms=on -mmt=4 compressed_asahi.7z asahi-ubuntu.img

    - name: Upload Artifact First
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compressed-asahi-ubuntu
        path: compressed_asahi.7z
        retention-days: 1

    - name: Start Local HTTP Server & Tunnel Port
      if: always()
      run: |
        # 1. Start Python HTTP server in background on port 8000
        python3 -m http.server 8000 &
        
        # 2. Open reverse TCP tunnel via Pinggy
        ssh -p 443 -o StrictHostKeyChecking=no -R0:localhost:8000 tcp@free.pinggy.io > tunnel.log 2>&1 &
        
        # Give tunnel time to establish and retrieve assigned port
        sleep 5
        
        # 3. Print tunnel connection details to action logs
        echo "=========================================="
        echo "YOUR PUBLIC DOWNLOAD LINK DETAILS:"
        cat tunnel.log
        echo "=========================================="
        
        # Keep job alive for 1 hour to allow downloading
        sleep 3600
