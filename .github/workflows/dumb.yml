name: Remote Download and Compress
on:
  workflow_dispatch: # Allows you to manually trigger it from the browser
    inputs:
      file_url:
        description: 'URL of the file to download'
        required: true
        default: 'https://tobhe.de'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc

    - name: Download the large image
      run: |
        echo "Downloading image from input URL..."
        curl -L -o asahi-ubuntu.img "${{ inputs.file_url }}"

    - name: Compress Ultra Strong with 7z
      run: |
        echo "Compressing with LZMA2 (Ultra Level 9)..."
        7z a -t7z -m0=lzma2 -mx=9 -md=64m compressed_asahi.7z asahi-ubuntu.img

    - name: Upload to a free transfer service
      run: |
        echo "Uploading compressed file to bashupload..."
        # This gives you a unique download link valid for 3 days
        curl -T compressed_asahi.7z https://bashupload.com
